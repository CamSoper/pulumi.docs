# FORK-ONLY benchmark harness (2026-09-28 Sonnet 5.5 effort sweep). Never PR upstream.
name: bench-sonnet55
on:
  push:
    branches: [claude/sonnet-5.5-benchmark-1kgmi7]
    paths: [bench/sonnet55/trigger.json]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.p.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "jobs=$(python3 -c "import json;print(json.dumps(json.load(open('bench/sonnet55/trigger.json'))['jobs']))")" >> "$GITHUB_OUTPUT"
  bench:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run ${{ matrix.job }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "bench/sonnet55/jobs/${{ matrix.job }}.sh" 2>&1 | tail -c 200000
      - name: Commit outputs back
        if: always()
        run: |
          git config user.name "bench-bot"; git config user.email "bench-bot@users.noreply.github.com"
          git add -A bench/sonnet55/out || true
          git commit -qm "bench: ${{ matrix.job }} outputs [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep $((i*7)); done
